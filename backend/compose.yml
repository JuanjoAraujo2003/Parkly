# PostgreSQL para desarrollo local del backend.
# Uso (desde la carpeta backend):
#   docker compose up -d
#   docker compose down        # detiene el contenedor y conserva los datos
#   docker compose down -v     # detiene y borra el volumen (reinicia la base)
#
# Las credenciales se pueden sobrescribir con variables de entorno o un archivo .env
# junto a este compose. Los valores por defecto son solo para desarrollo local.

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: parkly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkly}
      POSTGRES_USER: ${POSTGRES_USER:-parkly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
