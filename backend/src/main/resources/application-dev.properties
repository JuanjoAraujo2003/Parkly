# Desarrollo local. Coincide con backend/docker-compose.yml (docker compose up -d).
# Cada valor de conexión se puede sobrescribir con una variable de entorno.
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parkly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parkly}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parkly}
# En dev, además del esquema, Flyway carga los datos de prueba de db/dev-data.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-data
