# Configuración común a todos los entornos.
# El perfil activo se elige con SPRING_PROFILES_ACTIVE (dev o prod); si no se define, se usa dev.
# Los valores propios de cada entorno (datasource, ddl-auto) están en application-dev.properties
# y application-prod.properties.
spring.profiles.default=dev

# Sesión fija del administrador (sin autenticación todavía) y datos del parqueadero.
parkly.user.name=Juan Delgado
parkly.user.role=Administrador
parkly.parking.name=Parqueadero Central
parkly.parking.headquarters=Sede principal
