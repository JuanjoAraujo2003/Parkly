# Conexión a PostgreSQL. Cada valor se puede sobrescribir con una variable de entorno;
# los valores por defecto coinciden con backend/docker-compose.yml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parkly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parkly}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parkly}

# Crea o actualiza las tablas a partir de las entidades. Solo para desarrollo;
# para producción conviene migrar a Flyway o Liquibase.
spring.jpa.hibernate.ddl-auto=update
